name: CI Pipeline

on:
  push:
    branches: [main, 'feature/**' ]
  pull_request:
    branches: [ main ]


jobs:
  test:
    runs-on: ubuntu-latest


    steps:
    - name: Checout code
      uses: actions/checkout@v4


    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install pytest

    - name: Run tests
      run: python -m pytest day2-cicd/test.py -v

    - name: Success message
      run: echo 'All test pssed'
